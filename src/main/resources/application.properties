spring.application.name=luggage-portal
server.port=8081
# Filled by Maven at build time (-Dapp.env=STAGING). Shown in the page banner/footer.
app.environment=@app.env@
info.app.build=@app.build@
info.app.name=Luggage Complaint Portal
app.upload-dir=./uploads

# In-memory H2 so two WARs on one Tomcat do not fight over a DB file.
# For a persistent DB run with: --spring.datasource.url=jdbc:h2:file:./data/portaldb
spring.datasource.url=jdbc:h2:mem:portaldb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
