<!DOCTYPE html>

<head th:replace="~{fragments :: head('Not Found')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">

<footer th:replace="~{fragments :: footer}"></footer>

</html>
