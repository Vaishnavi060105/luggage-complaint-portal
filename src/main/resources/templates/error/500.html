<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
  <h1>500 - Something went wrong</h1>
  <p th:text="${message} ?: 'An unexpected error occurred. Please try again.'">An unexpected error occurred.</p>
  <a class="btn" th:href="@{/}">Back to home</a>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
