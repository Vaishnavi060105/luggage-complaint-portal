<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Complaints')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container">
  <h1>Complaints</h1>
  <form th:action="@{/reviewer/complaints}" method="get" class="inline-form">
    <label for="status">Filter by status</label>
    <select id="status" name="status">
      <option value="">All</option>
      <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s.name() == selected}"></option>
    </select>
    <button type="submit" class="btn">Filter</button>
  </form>
  <form th:action="@{/logout}" method="post" class="inline-form"><button type="submit" id="logout" class="btn secondary">Logout</button></form>
  <table>
    <thead><tr><th>Reference</th><th>Passenger</th><th>Flight</th><th>Type</th><th>Status</th><th>Submitted</th></tr></thead>
    <tbody>
      <tr th:each="c : ${complaints}">
        <td><a th:href="@{/reviewer/complaints/{id}(id=${c.id})}" th:text="${c.referenceNo}"></a></td>
        <td th:text="${c.passengerName}"></td>
        <td th:text="${c.flightNo}"></td>
        <td th:text="${c.type}"></td>
        <td th:text="${c.status}"></td>
        <td th:text="${#temporals.format(c.createdAt, 'dd MMM HH:mm')}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(complaints)}"><td colspan="6">No complaints found.</td></tr>
    </tbody>
  </table>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
